<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0f1512" media="(prefers-color-scheme: dark)">
<meta name="theme-color" content="#f4f7f5" media="(prefers-color-scheme: light)">
<title>Unser Tisch</title>
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icons/icon-192.png">
<link rel="apple-touch-icon" href="icons/icon-192.png">
<link rel="stylesheet" href="css/style.css">
</head>
<body>
<main id="app">
  <header class="top">
    <h1 id="title">Einkauf</h1>
    <button id="btnSettings" class="icon-btn" aria-label="Haushalt">
      <svg viewBox="0 0 24 24"><path d="M16 11a4 4 0 1 0-8 0 4 4 0 0 0 8 0Zm-12 9c0-3.3 3.6-5 8-5s8 1.7 8 5v1H4v-1Z"/></svg>
    </button>
  </header>

  <section id="viewList" class="view">
    <form id="addForm" class="add-row" autocomplete="off">
      <input id="addInput" placeholder="Was fehlt? z. B. 2 Tomaten" enterkeyhint="done">
      <button class="primary round" aria-label="Hinzufügen">+</button>
    </form>
    <div id="listBody"></div>
    <button id="btnClear" class="ghost hidden">Erledigte entfernen</button>
  </section>

  <section id="viewRecipes" class="view hidden">
    <input id="searchInput" class="search" type="search" placeholder="Rezepte suchen …">
    <div id="recipeGrid" class="grid"></div>
    <button id="btnNewRecipe" class="fab" aria-label="Neues Rezept">
      <svg viewBox="0 0 24 24"><path d="M11 5h2v6h6v2h-6v6h-2v-6H5v-2h6V5Z"/></svg><span>Rezept</span>
    </button>
  </section>
</main>

<nav class="tabs">
  <button data-tab="list" class="active"><svg viewBox="0 0 24 24"><path d="M3 5h2v2H3V5Zm4 0h14v2H7V5ZM3 11h2v2H3v-2Zm4 0h14v2H7v-2ZM3 17h2v2H3v-2Zm4 0h14v2H7v-2Z"/></svg>Einkauf<i id="badge" class="hidden"></i></button>
  <button data-tab="recipes"><svg viewBox="0 0 24 24"><path d="M6 3h12a1 1 0 0 1 1 1v17l-7-3-7 3V4a1 1 0 0 1 1-1Z"/></svg>Rezepte</button>
</nav>

<dialog id="dlgRecipe"><div class="sheet" id="recipeView"></div></dialog>
<dialog id="dlgEdit"><form class="sheet" id="editForm" method="dialog"></form></dialog>
<dialog id="dlgSettings"><div class="sheet" id="settingsView"></div></dialog>
<div id="toast" class="toast hidden"></div>

<script type="module" src="js/app.js"></script>
</body>
</html>
